spring:
  application:
    name: brambling-note-user
  cloud:
    consul:
      discovery:
        health-check-path: /health
      config:
        format: yaml
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
  jackson:
    mapper:
      default-view-inclusion: false
